name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/albegosu/vibe-translator/issues) first.
        For security issues, don't open an issue: follow [SECURITY.md](https://github.com/albegosu/vibe-translator/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Include the exact notification message if there was one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Write this draft in Discord: …
        2. Press ⌃⌥T
        3. …
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Original text and result
      description: The draft or selection you translated and what came out. Remove anything private.
      render: text
  - type: dropdown
    id: feature
    attributes:
      label: Feature
      options:
        - Translate draft
        - Restore / copy original
        - Translate selection
        - Settings or shortcuts
        - Diagnostics
        - Other
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Translation engine
      options:
        - Ollama (local model)
        - Ollama (cloud model)
        - Apple Intelligence
        - Apple Translation
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: access-method
    attributes:
      label: Access method (Ajustes › Método)
      options:
        - Automático
        - Accesibilidad
        - Portapapeles
        - Not sure
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "27.0.1"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App and version where it happened
      placeholder: "Discord 0.0.414"
  - type: input
    id: commit
    attributes:
      label: VibeTranslator commit or version
      placeholder: "ab26a17"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: Optional but very helpful. Run *Validación técnica › Diagnosticar campo activo* with the cursor in the problematic field and paste the report. It may include a preview of the field's text, so review it first.
      render: text
