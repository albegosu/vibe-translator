name: Release

# Push a version tag (git tag -s v0.1.0 -m "v0.1.0" && git push origin v0.1.0) and this
# builds a universal app, zips it and publishes the GitHub release with the CHANGELOG notes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=VibeTranslator-v$VERSION-macOS.zip" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARCHS: arm64 x86_64
        run: |
          scripts/build-app.sh
          lipo -info build/VibeTranslator.app/Contents/MacOS/VibeTranslator

      - name: Package
        env:
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          ditto -c -k --keepParent build/VibeTranslator.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          scripts/release-notes.sh "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "VibeTranslator $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
